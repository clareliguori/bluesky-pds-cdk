name: Rebase on Upstream
on:
  schedule:
  - cron: "0 20 * * *"  # run once a day
  workflow_dispatch:   # run manually

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/aws-samples/deploy-bluesky-pds-with-aws-cdk.git

      - name: Sync with upstream
        run: |
          git fetch upstream
          git rebase upstream/main || while [ -d "$(git rev-parse --git-path rebase-merge)" ]; do
            # Upstream modified a file that the fork's commit deletes: keep the deletion
            git status --porcelain | awk '$1 == "UD" {print $2}' | xargs -r git rm --quiet
            # Any other kind of conflict still needs a human
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              git status
              git rebase --abort
              exit 1
            fi
            GIT_EDITOR=true git rebase --continue \
              || [ -n "$(git diff --name-only --diff-filter=U)" ] \
              || { git rebase --abort; exit 1; }
          done
          git push --force-with-lease
